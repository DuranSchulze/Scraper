[project]
name = "workspace-scraper"
version = "0.1.0"
description = "Local read-only Google Workspace client scraper with review GUI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.1",
    "phonenumbers>=9.0.43",
    "psycopg[binary]>=3.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
