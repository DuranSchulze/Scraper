# Extraction rules. Edit this file, then press "Re-run extraction" in the GUI.
# No refetch from Google is needed after a rules change.
# Keyword matching is case-insensitive and matches whole words.

# --- Department handling -------------------------------------------------
# Address that received (or sent) the email -> department.
# A key ending in "@" matches that local part on any domain (e.g. "sales@").
# EDIT ME: replace the examples with the company's real aliases.
departments:
  "sales@": Sales
  "inquiries@": Sales
  "info@": Sales
  "support@": Support
  "billing@": Finance
  "accounts@": Finance

# Gmail label name -> department. Checked when no address matched.
label_departments: {}
  # "Clients/Marketing": Marketing

# --- Services -------------------------------------------------------------
# Service name -> keywords found in subject or body.
# Source of truth: FilePino SERVICE CATALOG v1.0 (one entry per Service Type, A01-E08).
# Keywords come from each type's service titles and description. A message may match several.
# Use specific phrases only. Never add bare ambiguous acronyms (SEC, BIR, DTI, DOLE, TIN, ACR,
# SPA, PEA, ECC, DAU, PWP, SWP): they occur in normal text ("one sec", "Dole", "spa").
# Each catalog title goes to exactly one service, so one request is not tagged twice.
