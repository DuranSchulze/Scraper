<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace Scraper</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --line:#ddd; --text:#1d1d1b; --muted:#6b6b66; --accent:#2f5d9e; --ok:#2e7d4f; --bad:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start; }
  h1 { font-size:16px; margin:0 0 6px; }
  h2 { font-size:14px; margin:0 0 8px; }
  fieldset { border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin:0; }
  label { display:block; font-size:12px; color:var(--muted); margin-top:6px; }
  label.inline { display:inline-flex; gap:4px; align-items:center; color:var(--text); font-size:13px; margin-right:10px; }
  input[type=text], input[type=date], input:not([type]), select, textarea { width:100%; padding:5px 7px; border:1px solid var(--line); border-radius:4px; font:inherit; background:#fff; color:inherit; }
  button { padding:6px 12px; border:1px solid var(--line); border-radius:4px; background:#fff; cursor:pointer; font:inherit; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.ok { background:var(--ok); border-color:var(--ok); color:#fff; }
  button.bad { color:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  #log { width:420px; max-width:100%; height:110px; overflow:auto; background:#1d1d1b; color:#e8e8e3; font:12px/1.4 ui-monospace, monospace; padding:6px 8px; border-radius:4px; white-space:pre-wrap; margin:0; }
  main { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; padding:12px 16px; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; min-width:0; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .filters > * { flex:1 1 120px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr { cursor:pointer; }
  tbody tr:hover, tbody tr.sel { background:#eef3fa; }
  .muted { color:var(--muted); }
  .conf { font-size:11px; color:var(--muted); }
  .ev { border-top:1px solid var(--line); padding:6px 0; font-size:12px; }
  .ev pre { white-space:pre-wrap; margin:4px 0 0; font:inherit; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  #tablewrap { max-height:70vh; overflow:auto; }
  dialog { max-width:800px; width:90vw; }
  dialog pre { white-space:pre-wrap; max-height:60vh; overflow:auto; font-size:12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Workspace Scraper</h1>
    <div id="counts" class="muted">loading…</div>
  </div>
  <fieldset>
    <legend>Scrape</legend>
    <label class="inline"><input type="checkbox" name="src" value="gmail" checked> Gmail</label>
    <label class="inline"><input type="checkbox" name="src" value="contacts" checked> Contacts</label>
    <label class="inline"><input type="checkbox" name="src" value="sheets" checked> Sheets</label>
    <label for="mailboxes">Mailboxes (comma list, blank = all users)</label>
    <input id="mailboxes" type="text" placeholder="sales@company.com, jane@company.com">
    <div class="row2">
      <div><label for="since">Since</label><input id="since" type="date"></div>
      <div><label class="inline" style="margin-top:24px"><input id="full" type="checkbox"> Full rescan</label></div>
    </div>
    <div class="actions">
      <button class="primary" id="runScrape">Run scrape</button>
      <button id="runExtract">Re-run extraction</button>
      <button id="showRules">View rules</button>
    </div>
  </fieldset>
  <div>
    <h2 id="jobTitle">Log</h2>
    <pre id="log" aria-live="polite"></pre>
  </div>
</header>

<main>
  <section>
    <div class="filters">
      <select id="fState" aria-label="Review state">
        <option value="pending">Pending review</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
        <option value="merged">Merged</option>
      </select>
      <select id="fStatus" aria-label="Status">
        <option value="">Any status</option><option>inquiry</option><option>active</option><option>past</option><option>lost</option>
      </select>
      <input id="fDept" type="text" placeholder="Department" aria-label="Department">
      <input id="fQ" type="text" placeholder="Search name or email" aria-label="Search">
    </div>
    <div id="tablewrap">
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Email / key</th><th>Status</th><th>Dept</th><th>Paid</th><th>Last contact</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <section id="detail">
    <p class="muted">Select a record to review.</p>
  </section>
</main>

<dialog id="dlg"><h2 id="dlgTitle"></h2><pre id="dlgBody"></pre><button id="dlgClose">Close</button></dialog>

<template id="detailTpl">
  <h2></h2>
  <form id="clientForm">
    <label for="d_name">Name</label><input id="d_name" name="name">
    <div class="row2">
      <div><label for="d_emails">Emails (comma list)</label><input id="d_emails" name="emails"></div>
      <div><label for="d_phones">Phones (comma list)</label><input id="d_phones" name="phones"></div>
    </div>
    <div class="row2">
      <div><label for="d_company">Company</label><input id="d_company" name="company"></div>
      <div><label for="d_department">Department handling</label><input id="d_department" name="department"></div>
    </div>
    <div class="row2">
      <div><label for="d_status">Status</label>
        <select id="d_status" name="status"><option>inquiry</option><option>active</option><option>past</option><option>lost</option></select></div>
      <div><label class="inline" style="margin-top:24px"><input id="d_paid" type="checkbox" name="engagement_paid"> Engagement paid</label></div>
    </div>
    <label for="d_services">Services (comma list)</label><input id="d_services" name="services">
    <label for="d_notes">Notes</label><textarea id="d_notes" name="notes" rows="2"></textarea>
    <p class="conf" id="d_conf"></p>
    <div class="actions">
      <button type="submit" class="ok">Approve</button>
      <button type="button" class="bad" id="d_reject">Reject</button>
      <button type="button" id="d_reopen">Back to pending</button>
      <input id="d_mergeId" type="number" min="1" placeholder="Merge into ID" aria-label="Merge into candidate ID" style="width:130px">
      <button type="button" id="d_merge">Merge</button>
    </div>
  </form>
  <h2 style="margin-top:16px">Evidence</h2>
  <div id="d_evidence"></div>
</template>

<script>
const $ = (s) => document.querySelector(s);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const list = (s) => s.split(',').map(x => x.trim()).filter(Boolean);

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-Local-GUI': '1' } });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail ? JSON.stringify(data.detail) : r.statusText);
  return data;
}
const post = (path, body) => api(path, { method: 'POST', body: JSON.stringify(body || {}) });

let wasRunning = false, selectedId = null;

async function refresh() {
  try {
    const s = await api('/api/status');
    const c = s.candidates, raw = s.raw_items;
    $('#counts').textContent =
      `Raw: gmail ${raw.gmail || 0}, contacts ${raw.contacts || 0}, sheets ${raw.sheets || 0} · ` +
      `Pending ${c.pending || 0} · Approved ${c.approved || 0} · Rejected ${c.rejected || 0} · Merged ${c.merged || 0}`;
    $('#jobTitle').textContent = s.running ? `Running: ${s.job}…` : (s.error ? `Last job failed` : 'Log');
    $('#log').textContent = s.log.join('\n');
    $('#log').scrollTop = $('#log').scrollHeight;
    $('#runScrape').disabled = $('#runExtract').disabled = s.running;
    if (wasRunning && !s.running) loadRows();
    wasRunning = s.running;
  } catch (e) { $('#counts').textContent = 'Error: ' + e.message; }
}
async function loop() { await refresh(); setTimeout(loop, wasRunning ? 1500 : 5000); }

async function loadRows() {
  const p = new URLSearchParams({ state: $('#fState').value, status: $('#fStatus').value, department: $('#fDept').value.trim(), q: $('#fQ').value.trim() });
  const rows = await api('/api/candidates?' + p);
  const tb = $('#rows'); tb.replaceChildren();
  for (const r of rows) {
    const tr = el('tr'); tr.tabIndex = 0;
    if (r.id === selectedId) tr.classList.add('sel');
    for (const v of [r.id, r.name || '—', r.email_key, r.status, r.department || '—', r.paid === 'true' ? 'yes' : 'no', (r.last_contact || '').slice(0, 10)]) tr.append(el('td', v));
    const open = () => { document.querySelectorAll('tr.sel').forEach(x => x.classList.remove('sel')); tr.classList.add('sel'); showDetail(r.id); };
    tr.onclick = open; tr.onkeydown = (e) => { if (e.key === 'Enter') open(); };
    tb.append(tr);
  }
  if (!rows.length) { const tr = el('tr'); const td = el('td', 'No records.', 'muted'); td.colSpan = 7; tr.append(td); tb.append(tr); }
}

async function showDetail(id) {
  selectedId = id;
  const c = await api('/api/candidates/' + id);
  const f = c.fields, v = (k) => (f[k] && f[k].value);
  const d = $('#detail'); d.replaceChildren($('#detailTpl').content.cloneNode(true));
  d.querySelector('h2').textContent = `#${c.id} · ${c.review_state}` + (c.client_id ? ` · client ${c.client_id}` : '') + (c.merged_into ? ` · merged into ${c.merged_into}` : '');
  $('#d_name').value = v('name') || '';
  $('#d_emails').value = (v('emails') || []).join(', ');
  $('#d_phones').value = (v('phones') || []).join(', ');
  $('#d_company').value = v('company') || '';
  $('#d_department').value = v('department') || '';
  $('#d_status').value = v('status') || 'inquiry';
  $('#d_paid').checked = !!v('engagement_paid');
  $('#d_services').value = (v('services') || []).join(', ');
  $('#d_conf').textContent = 'Found from: ' + ['name', 'company', 'status', 'department']
    .filter(k => f[k]).map(k => `${k} (${f[k].source}, ${Math.round(f[k].confidence * 100)}%)`).join(' · ') +
    (v('sources') ? ' · sources: ' + v('sources').join(', ') : '');

  $('#clientForm').onsubmit = async (e) => {
    e.preventDefault();
    try {
      await post(`/api/candidates/${id}/approve`, {
        name: $('#d_name').value.trim() || null, emails: list($('#d_emails').value), phones: list($('#d_phones').value),
        company: $('#d_company').value.trim() || null, department: $('#d_department').value.trim() || null,
        status: $('#d_status').value, engagement_paid: $('#d_paid').checked, services: list($('#d_services').value),
        notes: $('#d_notes').value.trim() || null,
        first_contact: v('first_contact') || null, last_contact: v('last_contact') || null,
      });
      done();
    } catch (err) { alert('Approve failed: ' + err.message); }
  };
  $('#d_reject').onclick = () => post(`/api/candidates/${id}/reject`).then(done).catch(err => alert(err.message));
  $('#d_reopen').onclick = () => post(`/api/candidates/${id}/reopen`).then(done).catch(err => alert(err.message));
  $('#d_merge').onclick = () => {
    const into = parseInt($('#d_mergeId').value, 10);
    if (!into) return alert('Enter the ID of the record to merge into.');
    post(`/api/candidates/${id}/merge`, { into_id: into }).then(done).catch(err => alert(err.message));
  };

  const ev = $('#d_evidence');
  for (const e of c.evidence) {
    const box = el('div', null, 'ev');
    const head = el('div', `${(e.date || '').slice(0, 10) || 'undated'} · ${e.source} · ${e.direction}` +
      (e.paid ? ' · PAID signal' : '') + (e.services && e.services.length ? ' · ' + e.services.join(', ') : ''), 'muted');
    const btn = el('button', 'Open source'); btn.type = 'button'; btn.style.marginLeft = '8px';
    btn.onclick = async () => {
      const r = await api('/api/raw/' + e.raw_item_id);
      $('#dlgTitle').textContent = `${r.source} · ${r.mailbox || ''} · ${r.source_id}`;
      $('#dlgBody').textContent = r.source === 'gmail'
        ? Object.entries(r.payload.headers).map(([k, v]) => `${k}: ${v}`).join('\n') + '\n\n' + r.payload.body
        : JSON.stringify(r.payload, null, 2);
      $('#dlg').showModal();
    };
    head.append(btn);
    box.append(head, el('pre', e.snippet));
    ev.append(box);
  }
  if (!c.evidence.length) ev.append(el('p', 'No evidence stored.', 'muted'));
}

function done() { $('#detail').replaceChildren(el('p', 'Saved. Select the next record.', 'muted')); selectedId = null; loadRows(); refresh(); }

$('#runScrape').onclick = () => {
  const sources = [...document.querySelectorAll('input[name=src]:checked')].map(x => x.value);
  if (!sources.length) return alert('Pick at least one source.');
  post('/api/scrape', { sources, mailboxes: list($('#mailboxes').value), since: $('#since').value, full: $('#full').checked })
    .then(() => { wasRunning = true; refresh(); }).catch(err => alert(err.message));
};
$('#runExtract').onclick = () => post('/api/extract').then(() => { wasRunning = true; refresh(); }).catch(err => alert(err.message));
$('#showRules').onclick = async () => {
  const r = await api('/api/rules');
  $('#dlgTitle').textContent = r.path + ' (edit the file, then Re-run extraction)';
  $('#dlgBody').textContent = r.text; $('#dlg').showModal();
};
$('#dlgClose').onclick = () => $('#dlg').close();
let qTimer;
for (const id of ['#fState', '#fStatus']) $(id).onchange = loadRows;
for (const id of ['#fDept', '#fQ']) $(id).oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(loadRows, 300); };

loop(); loadRows().catch(e => $('#counts').textContent = 'Error: ' + e.message);
</script>
</body>
</html>
